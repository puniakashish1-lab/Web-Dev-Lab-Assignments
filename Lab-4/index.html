
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h1>JavaScript Quiz Game</h1>

        <h2 id="question">Welcome to the Quiz!</h2>

        <div id="answer-buttons">
            <button class="answer-btn" onclick="checkAnswer(0)"></button>
            <button class="answer-btn" onclick="checkAnswer(1)"></button>
            <button class="answer-btn" onclick="checkAnswer(2)"></button>
            <button class="answer-btn" onclick="checkAnswer(3)"></button>
        </div>

        <p id="feedback"></p>

        <p id="score">Score: 0</p>

        <button id="next-btn" onclick="nextQuestion()">Next</button>
        <button id="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
